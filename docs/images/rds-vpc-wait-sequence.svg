<svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="900" height="560" fill="#ffffff" />

  <!-- Lifeline headers -->
  <rect x="40" y="25" width="240" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="160" y="56" font-size="13.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">RDSInstance controller</text>

  <rect x="600" y="25" width="240" height="50" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" />
  <text x="720" y="56" font-size="13.5" font-weight="bold" fill="#065f46" text-anchor="middle">Kubernetes API server</text>

  <!-- Lifelines -->
  <line x1="160" y1="75" x2="160" y2="520" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="720" y1="75" x2="720" y2="520" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Message 1: Get(self) -->
  <line x1="160" y1="110" x2="720" y2="110" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="440" y="102" font-size="12.5" fill="#334155" text-anchor="middle">Get(self)</text>

  <!-- Message 2: return RDSInstance object -->
  <line x1="720" y1="148" x2="160" y2="148" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowDash)" />
  <text x="440" y="140" font-size="12.5" fill="#64748b" text-anchor="middle">RDSInstance object (has Spec.VpcRef)</text>

  <!-- Message 3: Get(VpcRef) -->
  <line x1="160" y1="186" x2="720" y2="186" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="440" y="178" font-size="12.5" fill="#334155" text-anchor="middle">Get(client.ObjectKey{Name: Spec.VpcRef})</text>

  <!-- Message 4: return VPC.Status.Phase -->
  <line x1="720" y1="224" x2="160" y2="224" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowDash)" />
  <text x="440" y="216" font-size="12.5" fill="#64748b" text-anchor="middle">a DIFFERENT object — VPC.Status.Phase</text>

  <!-- Alt frame -->
  <rect x="95" y="255" width="710" height="235" rx="4" fill="none" stroke="#334155" stroke-width="1.5" />
  <path d="M 95 255 L 155 255 L 155 272 L 140 285 L 95 285 Z" fill="#f1f5f9" stroke="#334155" stroke-width="1.5" />
  <text x="108" y="274" font-size="12.5" font-weight="bold" fill="#334155">alt</text>

  <line x1="95" y1="380" x2="805" y2="380" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />

  <!-- Branch 1: not Ready -->
  <text x="170" y="302" font-size="12.5" font-weight="bold" fill="#991b1b">[ VPC.Status.Phase != "Ready" ]</text>

  <!-- self-loop on RDS lifeline -->
  <path d="M 160 325 L 230 325 L 230 350 L 160 350" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="245" y="332" font-size="12.5" fill="#991b1b">RequeueAfter(15s)</text>
  <text x="245" y="350" font-size="11.5" font-style="italic" fill="#991b1b">nil error — not a failure,</text>
  <text x="245" y="365" font-size="11.5" font-style="italic" fill="#991b1b">just "check back later"</text>

  <!-- Branch 2: Ready -->
  <text x="170" y="405" font-size="12.5" font-weight="bold" fill="#065f46">[ VPC.Status.Phase == "Ready" ]</text>
  <rect x="150" y="420" width="420" height="50" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" />
  <text x="360" y="442" font-size="12.5" fill="#065f46" text-anchor="middle">gate opens → provision the database,</text>
  <text x="360" y="460" font-size="12.5" fill="#065f46" text-anchor="middle">generate the credentials Secret (see DESIGN_DECISIONS.md)</text>

  <!-- Caption -->
  <text x="40" y="520" font-size="13" fill="#334155" font-weight="bold">Both "Get" calls use the exact same method — just pointed at a different object.</text>
  <text x="40" y="540" font-size="13" fill="#334155">Cross-resource waiting isn't a special mechanism; it's the same client, a different key, and patience.</text>
</svg>
