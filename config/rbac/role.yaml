---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - infra.cloudforge.dev
  resources:
  - rdsinstances
  - s3buckets
  - vpcs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - infra.cloudforge.dev
  resources:
  - rdsinstances/finalizers
  - s3buckets/finalizers
  - vpcs/finalizers
  verbs:
  - update
- apiGroups:
  - infra.cloudforge.dev
  resources:
  - rdsinstances/status
  - s3buckets/status
  - vpcs/status
  verbs:
  - get
  - patch
  - update
